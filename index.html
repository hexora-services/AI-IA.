<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="AI IA — შენი პირადი ხმოვანი ორგანიზატორი: შეხვედრები, შეხსენებები და ფინანსები.">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>AI IA — შენი პერსონალური ასისტენტი</title>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand desktop-brand"><span class="brand-mark">ia<span class="mark-dot">.</span></span><span class="brand-name">AI IA<small>your day, sorted.</small></span></div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span data-i18n="localOnly">Private · On this device</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="brand mobile-brand"><span class="brand-mark">ia<span class="mark-dot">.</span></span><span class="brand-name">AI IA</span></div>
        <div class="top-actions"><div class="today-pill"><span class="tiny-sun">✦</span><span id="headerDate"></span></div><button class="icon-btn" id="headerSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button></div>
      </header>
      <div id="content" aria-live="polite"></div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Navigation"></nav>
  <button id="voiceFab" class="voice-fab" aria-label="Voice assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v5m-4 0h8"/></svg></button>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
